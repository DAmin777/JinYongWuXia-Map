<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" seed="3"/>
      <feColorMatrix type="matrix" in="noise"
        values="1 0 0 0 0.96
                0 1 0 0 0.92
                0 0 1 0 0.87
                0 0 0 0.08 0" result="colored"/>
      <feComposite operator="in" in="colored" in2="SourceGraphic"/>
    </filter>
    <filter id="fibers" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.25 0.008" numOctaves="3" seed="7" result="fibers"/>
      <feColorMatrix type="matrix" in="fibers"
        values="1 0 0 0 0.90
                0 1 0 0 0.86
                0 0 1 0 0.80
                0 0 0 0.025 0"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#f4eade" filter="url(#paper)"/>
  <rect width="512" height="512" fill="none" filter="url(#fibers)"/>
</svg>
